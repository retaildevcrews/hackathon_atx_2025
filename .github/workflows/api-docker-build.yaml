name: Build and Push Workflow

on:
  push:
    branches: [ iac-cicd ]
    paths:
      - 'apps/api/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Azure login
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Build and deploy Frontend Container App
      uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
      with:
        appSourcePath: ${{ github.workspace }}
        dockerfilePath: ./apps/api/Dockerfile
        imageToBuild: ${{ secrets.ACR_NAME }}.azurecr.io/rt-api:latest
        acrName: ${{ secrets.ACR_NAME }}
        containerAppName: ${{ secrets.CONTAINER_APP_NAME }}
        resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
